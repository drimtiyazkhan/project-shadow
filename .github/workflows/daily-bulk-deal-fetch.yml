name: Daily Bulk Deal Fetch

on:
  schedule:
    # 13:30 UTC = 19:00 (7:00 PM) IST, Mon-Fri only (NSE doesn't publish on weekends)
    - cron: "30 13 * * 1-5"
  # Lets you trigger it manually from the Actions tab to test
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # allows room for the built-in retry/backoff logic
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Run fetch script
        run: python scripts/fetch_bulk_deals.py

      - name: Commit and push updated data
        run: |
          git config user.name "project-shadow-bot"
          git config user.email "actions@github.com"
          git add data/ logs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily bulk deal data update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
